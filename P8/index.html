
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positioning</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h2>My Website</h2>
        <div>
            <a href="#home">Home</a>
            <a href="#cards">Explore</a>
            <a href="#about">About</a>
        </div>
    </nav>

    <header id="home">
        <h1>Explore the World</h1>
        <p>Discover beautiful places around you.</p>
    </header>

    <main id="cards">
        <h2>Popular Destinations</h2>

        <div class="card-container">

            <div class="card">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600" alt="Mountain landscape">
                <div class="overlay">
                    <h3>Mountains</h3>
                    <p>Enjoy peaceful mountain views.</p>
                </div>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600" alt="Beach">
                <div class="overlay">
                    <h3>Beaches</h3>
                    <p>Relax by the sea.</p>
                </div>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=600" alt="City skyline">
                <div class="overlay">
                    <h3>Cities</h3>
                    <p>Explore busy city life.</p>
                </div>
            </div>

        </div>
    </main>

    <footer id="about">
        <p>My Website | Practical 8</p>
    </footer>

</body>
</html>
