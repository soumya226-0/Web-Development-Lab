
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Design System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Design System</h1>
        <p>A simple example of colors, spacing and typography.</p>
    </header>

    <main>
        <section>
            <h2>Color Palette</h2>
            <div class="colors">
                <div class="color-box primary">Primary</div>
                <div class="color-box secondary">Secondary</div>
                <div class="color-box accent">Accent</div>
            </div>
        </section>

        <section>
            <h2>Typography</h2>
            <h1>Heading One</h1>
            <h2>Heading Two</h2>
            <p>This is an example of paragraph text using CSS typography.</p>
        </section>

        <section>
            <h2>Spacing</h2>
            <div class="spacing-box">Small spacing</div>
            <div class="spacing-box large">Large spacing</div>
        </section>
    </main>

    <footer>
        <p>My CSS Design System</p>
    </footer>

</body>
</html>
